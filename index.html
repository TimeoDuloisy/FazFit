<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FazFit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout : appli mobile, une colonne de 760px max, en-tête collant + barre d'onglets en bas.
   Ton : tableau d'affichage de salle (chiffres condensés), neutres ardoise, accent au choix. */
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --surface2:#E9ECF1; --fg:#12151A; --muted:#5B6370; --line:#DADEE5;
  --good:#1D8650; --warn:#A86A12; --bad:#BE3434;
  --accent:var(--acc-l,#D94E1C); --on-accent:#FFFFFF;
  --soft:color-mix(in srgb,var(--accent) 13%,transparent);
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fig:#3B4351; --fig-far:#AEB5C0; --fig-hi:rgba(255,255,255,.35); --fig-hi2:#7C8594; --muscle:#E02B23;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1014; --surface:#161A20; --surface2:#1F242C; --fg:#ECEEF1; --muted:#9AA3B0; --line:#2A3039;
  --good:#3FCB83; --warn:#E8A93C; --bad:#F06A6A; --accent:var(--acc-d,#FF7A4D); --on-accent:#16100C; color-scheme:dark; --fig:#C9D0DA; --fig-far:#4E5765; --fig-hi:rgba(255,255,255,.4); --fig-hi2:#F2F4F7; --muscle:#FF5148}}
:root[data-theme="dark"]{
  --bg:#0D1014; --surface:#161A20; --surface2:#1F242C; --fg:#ECEEF1; --muted:#9AA3B0; --line:#2A3039;
  --good:#3FCB83; --warn:#E8A93C; --bad:#F06A6A; --accent:var(--acc-d,#FF7A4D); --on-accent:#16100C; color-scheme:dark; --fig:#C9D0DA; --fig-far:#4E5765; --fig-hi:rgba(255,255,255,.4); --fig-hi2:#F2F4F7; --muscle:#FF5148}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand b{color:var(--accent)}
main{padding-block:18px 110px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:34px;line-height:1.05;text-transform:uppercase}
h2{font-size:24px;line-height:1.1}
h3{font-size:19px;line-height:1.15}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.lg{gap:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:600;min-height:42px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px}
.btn.block{width:100%}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.neg[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:3px}
.opt b{font-weight:700;font-size:15px}
.opt span{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
input[type=range]{width:100%;accent-color:var(--accent)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.sw{width:48px;height:28px;border-radius:99px;border:0;background:var(--surface2);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.2s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{left:23px;background:var(--on-accent)}
.progress{height:6px;background:var(--surface2);border-radius:9px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.weeks{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.weeks button{flex:none;min-width:52px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.weeks button b{font-family:var(--display);font-size:20px}
.weeks button small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.weeks button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.weeks button[aria-pressed="true"] small{color:inherit;opacity:.75}
.day{padding:0;overflow:hidden}
.dayhead{display:flex;align-items:flex-start;gap:12px;padding:16px}
.daytag{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;background:var(--soft);color:var(--accent);border-radius:8px;padding:6px 8px;line-height:1;flex:none;text-align:center;min-width:46px}
.ex{border-top:1px solid var(--line)}
.exbtn{width:100%;border:0;background:none;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 16px}
.exbtn .presc{font-family:var(--display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.exdet{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.var{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.var div{background:var(--surface2);border-radius:10px;padding:10px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:3px 9px;background:var(--surface2);color:var(--muted)}
.pill.acc{background:var(--soft);color:var(--accent)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.subhead{padding:10px 16px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .v{font-family:var(--display);font-weight:700;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted);margin-top:4px}
.big{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;line-height:.95}
.timer{font-size:84px}
.ring{position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0}
.sess-ex{font-size:30px;text-transform:uppercase;line-height:1}
.setgrid{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px;align-items:center;font-size:14px}
.setgrid .h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.setrow-done{color:var(--good);font-weight:600}
.overlay{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.overlay .inner{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.heat .col{display:grid;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface2);display:block;max-width:100%}
.heat i.on{background:var(--accent)}
.heat i.today{outline:1.5px solid var(--fg);outline-offset:-1.5px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.hist summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.hist summary::-webkit-details-marker{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;max-width:90vw}
.notice{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px}
.exsearch{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.exsearch .it{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.exsearch .it:last-child{border-bottom:0}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:700}
.iconbtn[aria-pressed="true"].fav{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.iconbtn[aria-pressed="true"].no{background:var(--bad);color:#fff;border-color:var(--bad)}
.hero{background:var(--fg);color:var(--bg);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero .muted{color:color-mix(in srgb,var(--bg) 65%,var(--fg))}
.hero h1{color:var(--bg)}
.hero .stripe{position:absolute;right:-30px;top:0;bottom:0;width:120px;background:repeating-linear-gradient(-60deg,var(--accent) 0 10px,transparent 10px 22px);opacity:.9}
.hero > *:not(.stripe){position:relative;max-width:78%}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}.tiles .tile .v{font-size:27px}.timer{font-size:72px}.var{grid-template-columns:1fr}}
.fig{margin:0;background:var(--surface2);border-radius:12px;padding:6px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.fig svg{width:100%;max-width:340px;height:auto;display:block}
.fig figcaption{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;text-align:center}
.sessfig svg{max-width:250px}
.pill.hr{background:color-mix(in srgb,var(--muscle) 14%,transparent);color:var(--muscle)}
.mdot{width:9px;height:9px;border-radius:50%;background:var(--muscle);flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const ROLE_MUSCLE = {press_flat:'pectoraux',press_incline:'pectoraux',fly:'pectoraux',dips:'pectoraux',ohp:'épaules',lateral:'épaules',rear:'épaules',
  tri_compound:'triceps',tri_iso:'triceps',curl:'biceps',curl_alt:'biceps',hrow:'dos',vpull:'dos',back_iso:'dos',
  squat:'quadriceps',leg_press:'quadriceps',quad_iso:'quadriceps',lunge:'quadriceps',hinge:'ischios',ham_curl:'ischios',glutes:'fessiers',calves:'mollets',core:'abdos',core_dyn:'abdos'};
/* Modèles de séance (inspirés des routines publiées : bro split Outlift, PPL A Workout Routine, full body par schémas de mouvement).
   Un créneau « a|b » accepte l'un ou l'autre rôle ; « ? » = créneau facultatif, retiré en premier si la séance est courte. */
const T=(t,s)=>({t,s});
const TEMPLATES = {
  fullbody:[
    T('Full body A',['squat','press_flat|dips','hrow','hinge|glutes','ohp?','core?','curl?','tri_iso|tri_compound?']),
    T('Full body B',['hinge','vpull|hrow','press_incline|press_flat','lunge','lateral|rear?','core_dyn?','tri_iso|tri_compound?','curl_alt|curl?']),
    T('Full body C',['lunge|squat','hrow','ohp|press_incline','glutes|hinge','vpull|back_iso','core?','lateral?','curl|curl_alt?'])],
  hautbas:[
    T('Haut du corps A',['press_flat','hrow','ohp','vpull','lateral?','curl?','tri_iso?','rear?']),
    T('Bas du corps A',['squat','hinge','lunge|leg_press','ham_curl?','calves?','core?']),
    T('Haut du corps B',['press_incline|dips','vpull','ohp|press_flat','hrow','rear?','tri_compound|tri_iso?','curl_alt|curl?','lateral?']),
    T('Bas du corps B',['hinge','leg_press|squat','glutes','quad_iso|lunge?','ham_curl?','calves?','core_dyn?'])],
  ppl:[
    T('Push · pecs, épaules, triceps',['press_flat','ohp','press_incline|dips','lateral','tri_iso','fly?','tri_compound|tri_iso?']),
    T('Pull · dos, biceps',['vpull','hrow','rear','curl','back_iso|hrow?','curl_alt?']),
    T('Legs · jambes',['squat','hinge','leg_press|lunge','ham_curl','calves','quad_iso|glutes?','core_dyn?']),
    T('Push B · pecs, épaules, triceps',['ohp','press_incline','press_flat|dips','lateral','tri_compound|tri_iso','fly?','tri_iso?']),
    T('Pull B · dos, biceps',['hrow','vpull','rear','curl_alt','back_iso?','curl?']),
    T('Legs B · jambes',['hinge','squat|leg_press','lunge','glutes','ham_curl?','calves?','core?'])],
};
const BRO = {
  pectri:T('Pectoraux et triceps',['press_flat','press_incline','fly|dips','tri_compound|tri_iso','tri_iso','tri_iso?']),
  pecepaul:T('Pectoraux, épaules et triceps',['press_flat','ohp','press_incline|dips','lateral','tri_iso','tri_compound|tri_iso?']),
  dosbi:T('Dos et biceps',['vpull','hrow','hrow|back_iso','curl','curl_alt','rear?']),
  jambes:T('Jambes',['squat','hinge','leg_press|lunge','ham_curl','quad_iso|glutes?','calves']),
  jambesB:T('Jambes B',['hinge','leg_press|squat','lunge','glutes','ham_curl?','calves']),
  epaules:T('Épaules et abdos',['ohp','lateral','rear','lateral|ohp?','core_dyn','core']),
  bras:T('Bras',['curl','tri_compound|tri_iso','curl_alt','tri_iso','curl|curl_alt?','tri_iso?'])
};
const BRO_BY_N = {3:['pecepaul','dosbi','jambes'],4:['pectri','dosbi','jambes','epaules'],5:['pectri','dosbi','jambes','epaules','bras'],6:['pectri','dosbi','jambes','epaules','bras','jambesB'],7:['pectri','dosbi','jambes','epaules','bras','jambesB','pecepaul']};
function templatesFor(p){
  const n=p.jours.length;
  if(n===1) return TEMPLATES.fullbody;
  if(p.split==='muscle') return n<=2 ? TEMPLATES.hautbas : BRO_BY_N[n].map(k=>BRO[k]);
  if(p.split==='ppl' && n<=2) return TEMPLATES.hautbas;
  if(p.split==='ppl' && n<=4) return TEMPLATES.ppl.slice(0,3);
  return TEMPLATES[p.split]||TEMPLATES.fullbody;
}
const PRIO_ROLE = {pectoraux:'fly|press_incline',dos:'hrow|back_iso','épaules':'lateral',biceps:'curl_alt|curl',triceps:'tri_iso|tri_compound',quadriceps:'quad_iso|leg_press|lunge',ischios:'ham_curl|hinge',fessiers:'glutes',mollets:'calves',abdos:'core_dyn|core'};
const UPPER = new Set(['press_flat','press_incline','fly','dips','ohp','lateral','rear','tri_compound','tri_iso','curl','curl_alt','hrow','vpull','back_iso']);
const LOWER = new Set(['squat','leg_press','quad_iso','lunge','hinge','ham_curl','glutes','calves']);
const GOAL_SCH = {
  force:{c:[4,6,4,150],a:[8,10,3,90]}, muscle:{c:[8,12,4,90],a:[10,15,3,60]}, perte:{c:[12,15,3,45],a:[12,15,3,40]},
  endurance:{c:[15,20,3,30],a:[15,20,3,30]}, souplesse:{c:[10,12,3,60],a:[10,15,2,45]}, forme:{c:[10,12,3,60],a:[12,15,3,45]}, sport:{c:[5,8,4,120],a:[8,12,3,60]}
};
const RIR = {legere:'Garde 3 à 4 répétitions en réserve',moderee:'Garde 2 répétitions en réserve',elevee:'Va jusqu\'à 0 ou 1 répétition en réserve'};

function rngFrom(seed){ let a = seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function canDo(ex,eq){ if(!ex.eq) return true; return ex.eq.split('|').some(o=>o.split('+').every(k=>eq.has(k))); }
function eqSet(p){ return new Set((p.materiel||[]).filter(x=>x!=='aucun')); }
function allowed(ex,p,eq){
  if(!canDo(ex,eq)) return false;
  if((p.exclus||[]).includes(ex.id)) return false;
  if(ex.st.some(z=>(p.blessures||[]).includes(z))) return false;
  const maxLv = p.niveau==='debutant'?2:3;
  if(ex.lv>maxLv) return false;
  return true;
}
function candidates(pat,p,eq,opts={}){
  return DB.filter(e=>e.p===pat && allowed(e,p,eq) && (!opts.bodyweight || e.k!=='r'));
}
function scoreEx(e,ctx){
  const p=ctx.p; let s=ctx.rng()*4;
  if((p.favoris||[]).includes(e.id)) s+=100;
  s += e.m.filter(m=>(p.prioritaires||[]).includes(m)).length*3;
  const want = p.niveau==='debutant'?1:p.niveau==='intermediaire'?2:3;
  s -= Math.abs(e.lv-want)*2.5;
  if(['muscle','force'].includes(p.objectif) && e.k==='r') s+=6;
  if(e.k==='t' && !['core','core_dyn','cardio','mobility'].includes(e.p)) s-=6;
  if(p.lieu==='exterieur' && e.id==='course') s+=6;
  s -= (ctx.use[e.id]||0)*5;
  return s;
}
// slot : "a|b" ; essaie les rôles du créneau (le premier est préféré), puis les replis du même groupe musculaire
function pick(slot,ctx,used,opts={}){
  const roles=slot.replace('?','').split('|');
  let pool=[];
  roles.forEach((r,k)=>candidates(r,ctx.p,ctx.eq,opts).forEach(e=>{ if(!used.has(e.id)) pool.push({e,b:k===0?3:0}); }));
  if(!pool.length){
    const seen=new Set(roles); let fr=roles.map(r=>MUSCLE_FB[r]).filter(Boolean);
    for(let d=0; d<2 && !pool.length && fr.length; d++){
      fr=fr.filter(r=>!seen.has(r)); fr.forEach(r=>seen.add(r));
      fr.forEach(r=>candidates(r,ctx.p,ctx.eq,opts).forEach(e=>{ if(!used.has(e.id)) pool.push({e,b:0}); }));
      fr=fr.map(r=>MUSCLE_FB[r]).filter(Boolean);
    }
  }
  if(!pool.length) return null;
  pool.sort((a,b)=>scoreEx(b.e,ctx)+b.b-scoreEx(a.e,ctx)-a.b);
  return pool[0].e;
}
function baseScheme(ex,pat,p){
  const g = GOAL_SCH[p.objectif]||GOAL_SCH.forme;
  const comp = COMPOUND.has(pat);
  let [lo,hi,sets,rest] = comp ? g.c : g.a;
  if(ex.k==='rb' && p.objectif==='force'){ lo=6; hi=10; }
  if(p.niveau==='debutant') sets=Math.max(2,sets-1);
  if(p.intensite==='legere') sets=Math.max(2,sets-1);
  if(p.intensite==='elevee') sets=Math.min(6,sets+1);
  rest = Math.round(rest*({court:.7,standard:1,long:1.4}[p.repos]||1)/5)*5;
  if(ex.k==='t'){
    const dur = {core:30,core_dyn:30,cardio:40,mobility:45,back_iso:30,curl:30}[ex.p]||40;
    return {type:'time',sets,dur,rest:Math.min(rest,60)};
  }
  return {type:'reps',sets,lo,hi,rest};
}
function itemTime(sch){ const work = sch.type==='time'? sch.dur : Math.round((sch.lo+sch.hi)/2)*3+12; return sch.sets*(work+sch.rest); }

function warmupFor(day,ctx){
  const p=ctx.p, out=['Rotations articulaires : cou, épaules, hanches, genoux, chevilles · 2 min'];
  const cardio = ctx.eq.has('corde') && !p.blessures.includes('chevilles') ? 'Corde à sauter tranquille · 2 min' : ctx.eq.has('machines') ? 'Vélo ou rameur à allure facile · 3 min' : 'Jumping jacks ou marche rapide sur place · 2 min';
  out.push(cardio);
  const pats = new Set(day.items.map(i=>i.pat));
  if([...pats].some(x=>LOWER.has(x))) out.push('Squats lents et fentes au poids du corps · 10 de chaque');
  if([...pats].some(x=>UPPER.has(x))) out.push('Rotations d\'épaules et pompes inclinées · 10 de chaque');
  if(day.format==='sets' && day.items[0] && EX[day.items[0].exId].k==='r') out.push('1 à 2 séries légères de '+EX[day.items[0].exId].n.toLowerCase());
  return out;
}
function cooldownFor(day,ctx){
  const muscles = new Set(day.items.flatMap(i=>EX[i.exId].m));
  const n = (ctx.p.objectif==='souplesse'||ctx.p.objectif2==='souplesse') ? 5 : 3;
  const c = DB.filter(e=>e.p==='mobility' && allowed(e,ctx.p,ctx.eq))
    .map(e=>({e,s:e.m.filter(m=>muscles.has(m)).length*3+ctx.rng()*2}))
    .sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.e.id);
  return c;
}
function withPriorities(slots,p){
  // muscle prioritaire : un créneau ciblé de plus, seulement dans les séances qui travaillent déjà ce muscle
  const out=[...slots]; let added=0;
  const trained=new Set(slots.map(s=>ROLE_MUSCLE[s.replace('?','').split('|')[0]]));
  (p.prioritaires||[]).forEach(m=>{
    if(added>=2 || !PRIO_ROLE[m] || !trained.has(m)) return;
    const firstOpt=out.findIndex(s=>s.endsWith('?'));
    out.splice(firstOpt<0?out.length:firstOpt,0,PRIO_ROLE[m]); added++;
  });
  return out;
}

function buildDay(style,i,wd,ctx){
  const p=ctx.p;
  const wu = p.echauffement?7:0, cd = p.retour?5:0;
  const budget = Math.max(8,(p.duree-wu-cd))*60;
  const used = new Set();
  let day = {wd,style,title:'',format:'sets',items:[],roundRest:0};
  const bodyweight = style==='calisthenics';
  if(style==='musculation'||style==='calisthenics'||style==='circuit'){
    const tpls = templatesFor(p);
    const tpl = tpls[ctx.sIdx++ % tpls.length];
    const slots = withPriorities(tpl.s,p);
    day.title = (style==='circuit'?'Circuit · ':style==='calisthenics'?'Calisthenics · ':'')+tpl.t;
    const chosen=[];
    for(const slot of slots){
      const ex=pick(slot,ctx,used,{bodyweight}); if(!ex) continue; used.add(ex.id);
      chosen.push({exId:ex.id,pat:ex.p,slot:slot.replace('?',''),opt:slot.endsWith('?')});
    }
    if(style==='circuit'){
      day.format='circuit';
      const n = p.duree<=20?4:p.duree<=40?6:8;
      const keep=[...chosen.filter(c=>!c.opt),...chosen.filter(c=>c.opt)].slice(0,n);
      day.items = chosen.filter(c=>keep.includes(c)).map(c=>{ const ex=EX[c.exId];
        const sch = ex.k==='t'?{type:'time',sets:1,dur:40,rest:15}:{type:'reps',sets:1,lo:p.objectif==='force'&&ex.k==='r'?8:10,hi:p.objectif==='force'&&ex.k==='r'?10:15,rest:15};
        return {exId:c.exId,pat:c.pat,slot:c.slot,sch}; });
      day.roundRest = 90;
    } else {
      day.items = chosen.map(c=>({exId:c.exId,pat:c.pat,slot:c.slot,opt:c.opt,sch:baseScheme(EX[c.exId],c.pat,p)}));
      const total=()=>day.items.reduce((s,it)=>s+itemTime(it.sch),0);
      let guard=0;
      // trop long : on retire d'abord des séries d'isolation, puis les créneaux facultatifs (en partant de la fin)
      while(total()>budget*1.05 && guard++<60){
        const iso=day.items.filter(x=>!COMPOUND.has(x.pat) && x.sch.sets>2).sort((a,b)=>b.sch.sets-a.sch.sets)[0];
        const comp=day.items.filter(x=>COMPOUND.has(x.pat) && x.sch.sets>3).sort((a,b)=>b.sch.sets-a.sch.sets)[0];
        if(iso){ iso.sch.sets--; continue; }
        if(comp){ comp.sch.sets--; continue; }
        let k=-1; for(let j=day.items.length-1;j>=0;j--) if(day.items[j].opt){ k=j; break; }
        if(k>=0){ day.items.splice(k,1); continue; }
        const c2=day.items.filter(x=>x.sch.sets>2)[0];
        if(c2){ c2.sch.sets--; continue; }
        if(day.items.length>3){ day.items.pop(); continue; }
        break;
      }
      // temps restant : une série de plus, exercices principaux d'abord
      guard=0;
      while(guard++<30){
        const it = day.items.filter(x=>x.sch.sets<(COMPOUND.has(x.pat)?5:4)).sort((a,b)=>(COMPOUND.has(b.pat)?1:0)-(COMPOUND.has(a.pat)?1:0) || a.sch.sets-b.sch.sets)[0];
        if(!it) break; const per=itemTime({...it.sch,sets:1});
        if(total()+per>budget) break; it.sch.sets++;
      }
      // finisher selon l'objectif secondaire
      const usedT=total();
      if(['perte','endurance'].includes(p.objectif2) && budget-usedT>240){
        const f1=pick('cardio',ctx,used); if(f1){ used.add(f1.id); day.items.push({exId:f1.id,pat:'cardio',sch:{type:'time',sets:3,dur:30,rest:15},fin:true}); }
      }
    }
  } else if(style==='hiit'){
    day.title='HIIT'; day.format='circuit';
    const pats=['cardio','squat','press_flat','cardio','lunge','core_dyn|core','cardio','hrow','glutes|hinge'];
    const n = p.duree<=20?4:p.duree<=40?6:8;
    const on = {legere:30,moderee:40,elevee:45}[p.intensite]||40, off = 60-on;
    for(const pat of pats){ if(day.items.length>=n) break; const ex=pick(pat,ctx,used,{bodyweight:!ctx.eq.has('kettlebell')}); if(!ex) continue; used.add(ex.id);
      day.items.push({exId:ex.id,pat:ex.p,slot:pat,sch:{type:'time',sets:1,dur:on,rest:off}}); }
    day.roundRest=60;
  } else if(style==='cardio'){
    day.title='Cardio'; day.format='circuit';
    const n = p.duree<=30?3:4;
    for(let k=0;k<6 && day.items.length<n;k++){ const ex=pick(k===4?'core':'cardio',ctx,used); if(!ex) continue; used.add(ex.id);
      day.items.push({exId:ex.id,pat:ex.p,slot:ex.p,sch:{type:'time',sets:1,dur:ex.id==='course'||ex.id==='velo'||ex.id==='rameur'?240:60,rest:30}}); }
    day.roundRest=60;
  } else {
    day.title='Mobilité et yoga'; day.format='circuit';
    const n = p.duree<=20?5:p.duree<=40?7:9;
    const c = DB.filter(e=>e.p==='mobility' && allowed(e,p,ctx.eq)).map(e=>({e,s:ctx.rng()-(ctx.use[e.id]||0)})).sort((a,b)=>b.s-a.s).slice(0,n);
    c.forEach(({e})=>{ used.add(e.id); day.items.push({exId:e.id,pat:'mobility',slot:'mobility',sch:{type:'time',sets:1,dur:50,rest:10}}); });
    day.roundRest=30;
  }
  if(day.format==='circuit' && day.items.length){
    const per = day.items.reduce((s,it)=>s+itemTime(it.sch),0)+day.roundRest;
    const rounds = Math.max(2,Math.min(8,Math.floor((budget+day.roundRest)/per)));
    day.items.forEach(it=>it.sch.sets=rounds);
  }
  day.items.forEach(it=>ctx.use[it.exId]=(ctx.use[it.exId]||0)+1);
  day.warmup = p.echauffement ? warmupFor(day,ctx) : [];
  day.cooldown = p.retour ? cooldownFor(day,ctx) : [];
  return day;
}
function dayEst(day){
  let t = day.format==='circuit'
    ? day.items[0] ? day.items[0].sch.sets*(day.items.reduce((s,it)=>s+itemTime({...it.sch,sets:1}),0)+day.roundRest)-day.roundRest : 0
    : day.items.reduce((s,it)=>s+itemTime(it.sch),0);
  return Math.round(t/60)+(day.warmup.length?7:0)+(day.cooldown.length?5:0);
}
const PROGRAM_V=2;
function generate(p){
  const ctx={p,eq:eqSet(p),rng:rngFrom(Date.now()),use:{},sIdx:0};
  const mix=['musculation','hiit','musculation','mobilite','musculation','hiit','mobilite'];
  const jours=[...p.jours].sort((a,b)=>a-b);
  const days=jours.map((wd,i)=>buildDay(p.style==='melange'?mix[i]:p.style,i,wd,ctx));
  return {v:PROGRAM_V,createdAt:Date.now(),weeks:p.semaines,days};
}
function alternatives(item,day,p){
  const eq=eqSet(p); const inDay=new Set(day.items.map(i=>i.exId));
  const roles=[...(item.slot||item.pat).split('|'), EX[item.exId].p];
  const fb=MUSCLE_FB[EX[item.exId].p]; if(fb) roles.push(fb);
  const bw = day.style==='calisthenics';
  const out=[];
  roles.forEach(pt=>DB.forEach(e=>{ if(e.p===pt && !inDay.has(e.id) && allowed(e,p,eq) && (!bw||e.k!=='r') && !out.includes(e)) out.push(e); }));
  return out;
}

/* ---------- Progression ---------- */
function presc(it,week,weeks,niveau){
  const s=it.sch, ex=EX[it.exId];
  const b=(week-1)%4, blk=Math.floor((week-1)/4), deload = b===3 && week<weeks;
  let sets=s.sets, rest=s.rest, note='';
  if(s.type==='time'){
    let dur = s.dur + 5*Math.min(b,2) + 10*blk;
    if(deload){ dur=Math.max(20,s.dur-5); sets=Math.max(1,sets-1); note='Semaine allégée'; }
    return {type:'time',sets,dur,rest,note,deload};
  }
  let lo=s.lo, hi=s.hi;
  if(ex.k==='rb'){ lo+=2*blk; hi+=2*blk; }
  let reps = deload?lo: b===0?lo : b===1?Math.round((lo+hi)/2) : hi;
  if(!deload && b===2 && niveau!=='debutant' && sets<6 && !it.fin && s.sets>1) { sets++; }
  if(deload){ sets=Math.max(1,sets-1); note='Semaine allégée : charge à 85 %'; }
  else if(b===0 && blk>0 && ex.k==='r') note='Nouveau bloc : augmente la charge';
  else if(b===2) note = ex.k==='r'?'Haut de fourchette : vise la charge de la semaine 1':'Haut de fourchette';
  return {type:'reps',sets,reps,rest,note,deload};
}
const fmtDur = s => s>=60 ? (s%60? Math.floor(s/60)+' min '+(s%60)+' s' : (s/60)+' min') : s+' s';
const fmtClock = s => { s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), r=s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; };
function prescText(pr,circuit){
  if(circuit) return pr.type==='time' ? fmtDur(pr.dur) : pr.reps+' rép.';
  return pr.type==='time' ? pr.sets+' × '+fmtDur(pr.dur) : pr.sets+' × '+pr.reps;
}

/* ---------- Unités, dates ---------- */
const KG_LB=2.20462;
const toDisp=(kg,u)=> kg==null||kg==='' ? '' : u==='lb' ? Math.round(kg*KG_LB*2)/2 : Math.round(kg*10)/10;
const fromDisp=(v,u)=> v===''||v==null||isNaN(+v) ? null : u==='lb' ? +v/KG_LB : +v;
const dkey = d => { const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
const fmtDate = d => new Date(d).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const mondayOf = d => { const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };

function suggestLoad(exId,history,target){
  for(let i=history.length-1;i>=0;i--){
    const e=history[i].exercises.find(x=>x.exId===exId && x.sets.some(s=>s.w>0));
    if(!e) continue;
    const top=Math.max(...e.sets.map(s=>s.w||0));
    const hit=e.sets.every(s=>(s.r||0)>=(target||0));
    const ex=EX[exId]; const inc = /barre/.test(ex.eq)||/machines/.test(ex.eq) ? 2.5 : 1;
    return {kg: hit? top+inc : top, up:hit, last:top};
  }
  return null;
}

/* ---------- Petits composants ---------- */
function Seg({value,options,onChange,id}){
  return html`<div className="seg" role="group" id=${id}>${options.map(([k,l])=>html`<button type="button" key=${k} aria-pressed=${value===k} onClick=${()=>onChange(k)}>${l}</button>`)}</div>`;
}
function Switch({checked,onChange,id}){
  return html`<button type="button" className="sw" role="switch" id=${id} aria-checked=${!!checked} onClick=${()=>onChange(!checked)}></button>`;
}
function Opts({value,options,onChange,multi}){
  const on = k => multi ? value.includes(k) : value===k;
  return html`<div className="opts">${options.map(([k,l,d])=>html`<button type="button" key=${k} className="opt" aria-pressed=${on(k)} onClick=${()=>onChange(k)}><b>${l}</b>${d && html`<span>${d}</span>`}</button>`)}</div>`;
}
function Chips({value,options,onToggle,neg}){
  return html`<div className="chips">${options.map(([k,l])=>html`<button type="button" key=${k} className=${'chip'+(neg?' neg':'')} aria-pressed=${value.includes(k)} onClick=${()=>onToggle(k)}>${l}</button>`)}</div>`;
}
const toggleIn = (arr,k) => arr.includes(k) ? arr.filter(x=>x!==k) : [...arr,k];

function LineChart({data,unit,height=170}){
  if(data.length<2) return html`<p className="muted small" style=${{padding:'24px 0',textAlign:'center'}}>Il faut au moins deux mesures pour tracer une courbe.</p>`;
  const W=340,H=height,pl=36,pr=12,pt=14,pb=24;
  const ys=data.map(d=>d.y); let mn=Math.min(...ys), mx=Math.max(...ys); if(mn===mx){mn-=1;mx+=1;} const pad=(mx-mn)*.15; mn-=pad; mx+=pad;
  const x=i=>pl+(W-pl-pr)*i/(data.length-1), y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const ticks=[mn+(mx-mn)*.15,(mn+mx)/2,mx-(mx-mn)*.15];
  const line=data.map((d,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(d.y).toFixed(1)).join(' ');
  const area=line+` L${x(data.length-1)} ${H-pb} L${pl} ${H-pb} Z`;
  const last=data[data.length-1];
  const lblIdx=[0,Math.floor((data.length-1)/2),data.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  return html`<svg className="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Graphique">
    ${ticks.map((t,i)=>html`<g key=${i}><line x1=${pl} x2=${W-pr} y1=${y(t)} y2=${y(t)} stroke="var(--line)" stroke-dasharray="3 4"/><text x=${pl-6} y=${y(t)+3} textAnchor="end">${Math.round(t*10)/10}</text></g>`)}
    <path d=${area} fill="var(--accent)" opacity="0.12"/>
    <path d=${line} fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${data.map((d,i)=>(data.length<=30||i===data.length-1) && html`<circle key=${i} cx=${x(i)} cy=${y(d.y)} r=${i===data.length-1?4.5:2.5} fill=${i===data.length-1?'var(--accent)':'var(--surface)'} stroke="var(--accent)" stroke-width="1.5"/>`)}
    <text x=${Math.min(x(data.length-1),W-pr)} y=${Math.max(10,y(last.y)-9)} textAnchor="end" style=${{fill:'var(--fg)',fontWeight:700,fontSize:'11px'}}>${last.y}${unit?' '+unit:''}</text>
    ${lblIdx.map(i=>html`<text key=${'l'+i} x=${x(i)} y=${H-6} textAnchor=${i===0?'start':i===data.length-1?'end':'middle'}>${data[i].x}</text>`)}
  </svg>`;
}
function BarChart({data,unit}){
  if(!data.length) return html`<p className="muted small" style=${{padding:'24px 0',textAlign:'center'}}>Le volume apparaîtra après ta première séance.</p>`;
  const W=340,H=160,pl=8,pr=8,pt=18,pb=22; const mx=Math.max(...data.map(d=>d.y),1);
  const bw=(W-pl-pr)/data.length;
  return html`<svg className="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Volume par séance">
    <line x1=${pl} x2=${W-pr} y1=${H-pb} y2=${H-pb} stroke="var(--line)"/>
    ${data.map((d,i)=>{ const h=(H-pt-pb)*d.y/mx; const last=i===data.length-1; return html`<g key=${i}>
      <rect x=${pl+i*bw+bw*.18} y=${H-pb-h} width=${bw*.64} height=${Math.max(h,1)} rx="3" fill="var(--accent)" opacity=${last?1:.45}/>
      ${(last||data.length<=8) && html`<text x=${pl+i*bw+bw/2} y=${H-pb-h-5} textAnchor="middle" style=${last?{fill:'var(--fg)',fontWeight:700}:null}>${d.lab}</text>`}
      ${(i===0||last) && html`<text x=${pl+i*bw+bw/2} y=${H-7} textAnchor="middle">${d.x}</text>`}
    </g>`;})}
  </svg>`;
}

/* ---------- Questionnaire ---------- */
const SPREAD={1:[2],2:[1,4],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,4,5],6:[0,1,2,3,4,5],7:[0,1,2,3,4,5,6]};

function Questionnaire({initial,settings,setSettings,onDone,onCancel}){

    p.materiel.length>0,

    true,true

  const errors=['Renseigne ton âge (12 à 99 ans), ton sexe, ta taille et ton poids.','Indique le sport que tu prépares.','Coche au moins une option, ou « Aucun ».','Choisis '+p.seances+' jour'+(p.seances>1?'s':'')+' dans la semaine.','',''];
  const setSeances=n=>setP(o=>({...o,seances:n,jours:SPREAD[n]}));
  const toggleDay=d=>setP(o=>{ let j=o.jours; if(j.includes(d)) j=j.filter(x=>x!==d); else { j=[...j,d]; if(j.length>o.seances) j=j.slice(1); } return {...o,jours:j}; });
  const setLieu=l=>setP(o=>({...o,lieu:l,materiel:PLACE_EQ[l]}));
  const toggleEq=k=>setP(o=>{ if(k==='aucun') return {...o,materiel:['aucun']}; let m=toggleIn(o.materiel.filter(x=>x!=='aucun'),k); if(!m.length) m=['aucun']; return {...o,materiel:m}; });

  const exList=DB.filter(e=>canDo(e,eq) && (!q || e.n.toLowerCase().includes(q.toLowerCase())));

  const splitNote = p.split==='muscle' && p.seances<=2 ? ' Le split par muscle demande au moins 3 séances : FazFit utilisera un haut / bas.' : p.split==='ppl' && p.seances<=2 ? ' Push / Pull / Legs demande au moins 3 séances : FazFit utilisera un haut / bas.' : '';

  const body=[
    html`<div className="stack lg">
      <div className="grid2">
        <label className="f" htmlFor="q-age">Âge<input id="q-age" className="inp" type="number" inputMode="numeric" min="12" max="99" placeholder="ex. 28" value=${p.age} onChange=${e=>set('age',e.target.value===''?'':+e.target.value)}/></label>

      </div>
      <div className="stack"><span className="eyebrow">Niveau</span><${Opts} value=${p.niveau} options=${LEVELS} onChange=${v=>set('niveau',v)}/></div>
    </div>`,
    html`<div className="stack lg">
      <div className="stack"><span className="eyebrow">Objectif principal</span><${Opts} value=${p.objectif} options=${GOALS} onChange=${v=>setP(o=>({...o,objectif:v,objectif2:o.objectif2===v?'':o.objectif2}))}/></div>

    </div>`,
    html`<div className="stack lg">

    html`<div className="stack lg">

    html`<div className="stack lg">
      <div className="stack"><span className="eyebrow">Style d'entraînement</span><${Opts} value=${p.style} options=${STYLES} onChange=${v=>set('style',v)}/></div>

        <div className="stack"><span className="eyebrow">Intensité</span><${Seg} id="q-int" value=${p.intensite} options=${INTENS} onChange=${v=>set('intensite',v)}/></div>

      </div>
    </div>`,
    html`<div className="stack">
      <p className="muted">Marque tes favoris (ils passeront en priorité) et les exercices à ne jamais proposer. Étape facultative.</p>
      <input id="q-search" className="inp" placeholder="Rechercher un exercice" value=${q} onChange=${e=>setQ(e.target.value)}/>

        <button type="button" className="iconbtn no" title="Exclure" aria-label=${'Exclure : '+e.n} aria-pressed=${p.exclus.includes(e.id)} onClick=${()=>setP(o=>({...o,exclus:toggleIn(o.exclus,e.id),favoris:o.favoris.filter(x=>x!==e.id)}))}>✕</button>
      </div>`)}</div>
      <p className="small muted">${p.favoris.length} favori${p.favoris.length>1?'s':''} · ${p.exclus.length} exclu${p.exclus.length>1?'s':''}</p>
    </div>`
  ];
  const titles=['Parle-nous de toi','Ce que tu vises','Ton terrain de jeu','Ton emploi du temps','Ta façon de t\'entraîner','Tes exercices'];
  return html`<div className="stack lg">
    <div className="stack">
      <div className="row between"><span className="eyebrow">Étape ${step+1} sur ${STEPS.length} · ${STEPS[step]}</span>${onCancel && html`<button className="btn ghost sm" onClick=${onCancel}>Annuler</button>`}</div>
      <div className="progress"><i style=${{width:((step+1)/STEPS.length*100)+'%'}}></i></div>
    </div>

    <div className="row" style=${{gap:'10px'}}>
      ${step>0 && html`<button className="btn" onClick=${()=>setStep(step-1)}>Retour</button>`}

    </div>
  </div>`;
}

function ProgramView({profile,program,setProgram,week,setWeek,onStart,history,toast}){

  const doneThisWeek = useMemo(()=>new Set(history.filter(h=>h.week===week && h.programAt===program.createdAt).map(h=>h.dayIdx)),[history,week,program]);
  const swap=(di,ii)=>{
    const day=program.days[di], it=day.items[ii];
    const alts=alternatives(it,day,profile); if(!alts.length) return;
    const pos = ++SWAP_N;
    const ne = alts[pos % alts.length];
    const sch = ne.k==='t' && it.sch.type!=='time' ? {type:'time',sets:it.sch.sets,dur:40,rest:it.sch.rest} : ne.k!=='t' && it.sch.type==='time' ? (day.format==='circuit'? {...it.sch} : {type:'reps',sets:it.sch.sets,lo:10,hi:12,rest:it.sch.rest}) : it.sch;
    const days=program.days.map((d,i)=> i!==di ? d : {...d,items:d.items.map((x,j)=> j!==ii ? x : {...x,exId:ne.id,sch})});
    setProgram({...program,days});
    toast(EX[it.exId].n+' remplacé par '+ne.n);
  };
  const totalMin = program.days.reduce((s,d)=>s+dayEst(d),0);
  return html`<div className="stack lg">
    <section className="hero">

      <div className="row between"><h2>Semaine ${week}</h2>${presc({sch:{type:'reps',sets:3,lo:8,hi:12,rest:60},exId:'pompes'},week,program.weeks,profile.niveau).deload ? html`<span className="pill warn">Semaine allégée</span>` : html`<span className="pill">Bloc ${Math.floor((week-1)/4)+1} · semaine ${(week-1)%4+1}</span>`}</div>
      <div className="weeks" role="group" aria-label="Semaines">${Array.from({length:program.weeks},(_,i)=>i+1).map(w=>{ const dl=(w-1)%4===3 && w<program.weeks; return html`<button key=${w} aria-pressed=${w===week} onClick=${()=>setWeek(w)}><small>${dl?'Allégée':'Sem.'}</small><b>${w}</b></button>`; })}</div>
      <p className="small muted">${RIR[profile.intensite]}. Les répétitions montent de semaine en semaine, puis la charge augmente au bloc suivant.</p>
    </div>
    ${program.days.map((day,di)=>{
      const circuit=day.format==='circuit';
      const P=day.items.map(it=>presc(it,week,program.weeks,profile.niveau));
      const done=doneThisWeek.has(di);
      return html`<article className="card day" key=${di}>
        <div className="dayhead">
          <span className="daytag">${DAYS3[day.wd]}</span>
          <div className="grow"><h3>${day.title}</h3><p className="small muted">${DAYS[day.wd]} · ${day.items.length} exercices · ~${dayEst(day)} min</p></div>
          ${done ? html`<span className="pill good">Faite</span>` : html`<button className="btn pri sm" onClick=${()=>onStart(di)}>Démarrer</button>`}
        </div>
        ${day.warmup.length>0 && html`<div className="subhead"><span>Échauffement</span><span>~7 min</span></div>
          <div style=${{padding:'10px 16px'}}><ul className="list small">${day.warmup.map((w,i)=>html`<li key=${i}>${w}</li>`)}</ul></div>`}
        <div className="subhead"><span>${circuit ? (P[0]?P[0].sets:0)+' tours · enchaîne sans pause' : 'Corps de séance'}</span><span>${circuit ? 'récup '+fmtDur(P[0]?P[0].rest:0)+' entre exercices, '+fmtDur(day.roundRest)+' entre tours' : 'séries × répétitions'}</span></div>
        ${day.items.map((it,ii)=>html`<${ExerciseRow} key=${ii+it.exId} it=${it} pr=${P[ii]} circuit=${circuit} altCount=${alternatives(it,day,profile).length} onSwap=${()=>swap(di,ii)}/>`)}
        ${day.cooldown.length>0 && html`<div className="subhead"><span>Retour au calme</span><span>~5 min</span></div>
          <div style=${{padding:'10px 16px 14px'}}><ul className="list small">${day.cooldown.map(id=>html`<li key=${id}>${EX[id].n} · 45 s</li>`)}</ul></div>`}

/* ---------- Mode séance ---------- */
let audioCtx=null;
function beep(n=2){ try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); for(let i=0;i<n;i++){ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=i===n-1?1046:784; o.connect(g); g.connect(audioCtx.destination); const t=audioCtx.currentTime+i*.22; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.25,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.start(t); o.stop(t+.2);} }catch(e){} try{ navigator.vibrate && navigator.vibrate([120,80,120]); }catch(e){} }
function unlockAudio(){ try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume && audioCtx.resume(); }catch(e){} }

function useTick(active){ const [,f]=useState(0); useEffect(()=>{ if(!active) return; const t=setInterval(()=>f(x=>x+1),250); return ()=>clearInterval(t); },[active]); return Date.now(); }

function buildSteps(day,P){
  const steps=[];
  if(day.warmup.length) steps.push({kind:'warmup'});
  const n=day.items.length;
  if(day.format==='circuit'){
    const R=P[0]?P[0].sets:0;
    for(let r=0;r<R;r++) for(let i=0;i<n;i++){ const lastInRound=i===n-1; steps.push({kind:'set',i,set:r,of:R,rest: lastInRound ? (r===R-1?0:day.roundRest) : P[i].rest}); }
  } else {
    for(let i=0;i<n;i++) for(let s=0;s<P[i].sets;s++) steps.push({kind:'set',i,set:s,of:P[i].sets,rest:(i===n-1&&s===P[i].sets-1)?0:P[i].rest});
  }
  if(day.cooldown.length) steps.push({kind:'cooldown'});
  steps.push({kind:'end'});
  return steps;
}

function SessionView({session,setSession,program,profile,settings,history,onFinish,onAbort}){
  const u=settings.unit;
  const now=useTick(true);
  const [confirmQuit,setConfirmQuit]=useState(false);
  const day=session.day, P=session.P, steps=session.steps;
  const st=steps[session.step];
  const elapsed=(now-session.start)/1000;
  const resting = session.restEnd && session.restEnd>now;
  const working = session.workEnd && session.workEnd>now;
  const firedRef=useRef({});
  // fin du repos / fin de l'effort chronométré
  useEffect(()=>{
    if(session.restEnd && now>=session.restEnd && !firedRef.current['r'+session.restEnd]){ firedRef.current['r'+session.restEnd]=1; beep(3); setSession(s=>({...s,restEnd:null})); }
    if(session.workEnd && now>=session.workEnd && !firedRef.current['w'+session.workEnd]){ firedRef.current['w'+session.workEnd]=1; beep(2); completeSet({r:null,w:null,t:P[st.i].dur}); }
  });
  const logs=session.logs;
  const setLog=(i,s,val)=>setSession(o=>{ const L={...o.logs}; const arr=[...(L[i]||[])]; arr[s]={...(arr[s]||{}),...val}; L[i]=arr; return {...o,logs:L}; });
  function advance(rest){ setSession(o=>({...o,step:Math.min(o.step+1,o.steps.length-1),workEnd:null,restEnd: rest>0 ? Date.now()+rest*1000 : null})); window.scrollTo(0,0); }
  function completeSet(val){
    const cur=steps[session.step];
    setLog(cur.i,cur.set,{...val,d:true});
    advance(cur.rest);
  }
  const draft = st && st.kind==='set' ? (session.draft && session.draft.k===session.step ? session.draft : null) : null;
  const curEx = st && st.kind==='set' ? EX[day.items[st.i].exId] : null;
  const sug = curEx && curEx.k==='r' ? suggestLoad(curEx.id,history,P[st.i].reps) : null;
  const prevW = st && st.kind==='set' ? (()=>{ const a=logs[st.i]||[]; for(let k=st.set-1;k>=0;k--) if(a[k]&&a[k].w!=null) return a[k].w; return null; })() : null;
  const defW = prevW!=null ? prevW : sug ? sug.kg : null;
  const wVal = draft && draft.w!==undefined ? draft.w : (defW!=null ? String(toDisp(defW,u)) : '');
  const rVal = draft && draft.r!==undefined ? draft.r : (st && st.kind==='set' && P[st.i].type==='reps' ? String(P[st.i].reps) : '');
  const setDraft=(k,v)=>setSession(o=>({...o,draft:{...(o.draft&&o.draft.k===o.step?o.draft:{k:o.step}),[k]:v}}));
  const doneSets = steps.filter((s,idx)=>s.kind==='set' && logs[s.i] && logs[s.i][s.set] && logs[s.i][s.set].d).length;
  const totalSets = steps.filter(s=>s.kind==='set').length;
  const nextSet = steps.slice(session.step).find(s=>s.kind==='set');
  const nextEx = nextSet ? EX[day.items[nextSet.i].exId] : null;
  const swapHere=()=>{
    const it=day.items[st.i]; const alts=alternatives(it,day,profile); if(!alts.length) return;
    const ne=alts[(session.swaps||0)%alts.length];
    const items=day.items.map((x,j)=>j===st.i?{...x,exId:ne.id}:x);
    setSession(o=>({...o,day:{...o.day,items},swaps:(o.swaps||0)+1}));
  };

  return html`<div className="stack lg">
    <div className="row between">
      <div><span className="eyebrow">Semaine ${session.week} · ${DAYS[day.wd]}</span><h2>${day.title}</h2></div>
      <div style=${{textAlign:'right'}}><div className="num big" style=${{fontSize:'30px'}}>${fmtClock(elapsed)}</div><span className="small muted">chronomètre</span></div>
    </div>

      <div className="progress"><i style=${{width:(totalSets?doneSets/totalSets*100:0)+'%'}}></i></div>

    </div>

    ${st.kind==='warmup' && html`<section className="card stack">
      <span className="eyebrow">Échauffement</span><h2>Prépare ton corps</h2>
      <ul className="list">${day.warmup.map((w,i)=>html`<li key=${i}>${w}</li>`)}</ul>
      <button className="btn pri block" onClick=${()=>{unlockAudio();advance(0);}}>Échauffement terminé</button>
    </section>`}

    ${st.kind==='set' && html`<section className="card stack lg">
      <div className="stack" style=${{gap:'6px'}}>
        <div className="row between"><span className="eyebrow">${day.format==='circuit'?'Tour '+(st.set+1)+' sur '+st.of+' · exercice '+(st.i+1)+'/'+day.items.length:'Série '+(st.set+1)+' sur '+st.of}</span>
          <button className="btn ghost sm" onClick=${swapHere}>${I.swap} Remplacer</button></div>
        <div className="sessfig"><${Figure} key=${curEx.id} exId=${curEx.id}/></div>
        <h2 className="sess-ex">${curEx.n}</h2>
        <p className="muted small">${curEx.c}</p>
      </div>
      <div className="row" style=${{gap:'8px'}}>
        <span className="pill acc">Objectif : ${P[st.i].type==='time'?fmtDur(P[st.i].dur):P[st.i].reps+' répétitions'}</span>
        ${P[st.i].rest>0 && html`<span className="pill">Repos ${fmtDur(st.rest||P[st.i].rest)}</span>`}
        ${sug && html`<span className=${'pill'+(sug.up?' good':'')}>${sug.up?'Charge conseillée ↑ ':'Dernière fois : '}${toDisp(sug.up?sug.kg:sug.last,u)} ${u}</span>`}
      </div>
      ${P[st.i].type==='time' ? html`<div className="stack" style=${{alignItems:'center'}}>
          <div className="big timer num">${working ? fmtClock((session.workEnd-now)/1000) : fmtClock(P[st.i].dur)}</div>
          ${working ? html`<button className="btn block" onClick=${()=>completeSet({t:Math.round(P[st.i].dur-(session.workEnd-now)/1000)})}>Arrêter et valider</button>`
                    : html`<button className="btn pri block" onClick=${()=>{unlockAudio(); setSession(o=>({...o,workEnd:Date.now()+P[st.i].dur*1000}));}}>Démarrer ${fmtDur(P[st.i].dur)}</button>`}

            <label className="f" htmlFor="s-r">Répétitions faites<input id="s-r" className="inp num" style=${{fontSize:'24px'}} type="number" inputMode="numeric" value=${rVal} onChange=${e=>setDraft('r',e.target.value)}/></label>

          <button className="btn pri block" style=${{minHeight:'52px',fontSize:'17px'}} onClick=${()=>{unlockAudio(); completeSet({w:curEx.k==='r'?fromDisp(wVal,u):null,r:rVal===''?0:+rVal});}}>Série terminée</button>
        </div>`}

/* ---------- Montre Garmin (facultatif) ----------
   Import de fichiers exportés depuis Garmin Connect : CSV de la liste d'activités, TCX ou FIT (seul ou dans le .zip « fichier d'origine »). */
const normH = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/^﻿/,'').trim();
function csvRows(text){
  const first=text.split(/\r?\n/)[0]||''; const sep=(first.split(';').length>first.split(',').length)?';':',';
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true; else if(c===sep){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); cur=''; if(row.some(x=>x!=='')) rows.push(row); row=[]; }
    else cur+=c; }
  row.push(cur); if(row.some(x=>x!=='')) rows.push(row);
  return rows;
}
function numG(v){ if(v==null) return null; v=String(v).trim(); if(!v||v==='--') return null;
  if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(v)) v=v.replace(/,/g,''); else v=v.replace(/[\s ]/g,'').replace(',','.');
  const n=parseFloat(v); return isNaN(n)?null:n; }
function durG(v){ if(v==null) return null; v=String(v).trim(); if(!v||v==='--') return null;
  if(v.includes(':')){ const p=v.split(':').map(x=>parseFloat(x.replace(',','.'))); if(p.some(isNaN)) return null; return Math.round(p.reduce((a,x)=>a*60+x,0)); }
  const n=numG(v); return n==null?null:Math.round(n*60); }
function dateG(v){ v=String(v||'').trim(); let m;
  if((m=v.match(/^(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/))) return new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)).getTime();
  if((m=v.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})[ T,]*(\d{1,2}):(\d{2})(?::(\d{2}))?/))) return new Date(+m[3],m[2]-1,+m[1],+m[4],+m[5],+(m[6]||0)).getTime();
  const t=Date.parse(v); return isNaN(t)?null:t; }
function parseGarminCSV(text){
  const rows=csvRows(text); if(rows.length<2) return [];
  const H=rows[0].map(normH); const find=f=>H.findIndex(f);
  const hrTok=h=>/\bhr\b|cardiaque|\bfc\b/.test(h);
  const ix={
    type:find(h=>h.includes('type')), date:find(h=>h==='date'||h.startsWith('date')), title:find(h=>h==='titre'||h==='title'||h==='nom'),
    cal:find(h=>h.startsWith('calor')), time:find(h=>h==='time'||h==='duree'||h==='temps'||h==='elapsed time'||h==='temps ecoule'),
    avg:find(h=>/avg|moy/.test(h) && hrTok(h)), max:find(h=>/max/.test(h) && !/avg|moy/.test(h) && hrTok(h))
  };
  if(ix.date<0) throw new Error('Colonne « Date » introuvable : ce fichier ne ressemble pas à un export d\'activités Garmin Connect.');
  return rows.slice(1).map(r=>{ const start=dateG(r[ix.date]); if(!start) return null;
    return {id:'g'+start, source:'csv', start, dur:ix.time>=0?durG(r[ix.time]):null, cal:ix.cal>=0?numG(r[ix.cal]):null,
      avgHr:ix.avg>=0?numG(r[ix.avg]):null, maxHr:ix.max>=0?numG(r[ix.max]):null,
      type:ix.type>=0?r[ix.type]:'', title:ix.title>=0?r[ix.title]:''}; }).filter(Boolean);
}
function shrinkSeries(pts,start){ // [[ms,bpm]] -> [[s depuis le début,bpm]] ~150 points
  if(!pts.length) return null; const step=Math.max(1,Math.ceil(pts.length/150)); const out=[];
  for(let i=0;i<pts.length;i+=step){ const sl=pts.slice(i,i+step); out.push([Math.round((sl[0][0]-start)/1000),Math.round(sl.reduce((a,p)=>a+p[1],0)/sl.length)]); }
  return out; }
function summarize(o,pts){
  if(pts.length){ const hr=pts.map(p=>p[1]); if(o.avgHr==null) o.avgHr=Math.round(hr.reduce((a,b)=>a+b,0)/hr.length); if(o.maxHr==null) o.maxHr=Math.max(...hr);
    if(!o.start) o.start=pts[0][0]; if(!o.dur) o.dur=Math.round((pts[pts.length-1][0]-pts[0][0])/1000); o.series=shrinkSeries(pts,o.start); }

function parseTCX(text){
  const d=new DOMParser().parseFromString(text,'application/xml');
  if(d.getElementsByTagName('parsererror').length) throw new Error('Fichier TCX illisible.');
  const tag=(el,n)=>{ const x=el.getElementsByTagName(n)[0]; return x?x.textContent:null; };
  const acts=[...d.getElementsByTagName('Activity')]; if(!acts.length) throw new Error('Aucune activité dans ce fichier TCX.');
  return acts.map(a=>{
    const laps=[...a.getElementsByTagName('Lap')];
    const o={source:'tcx',type:a.getAttribute('Sport')||'',title:'',start:Date.parse(tag(a,'Id')||(laps[0]&&laps[0].getAttribute('StartTime'))),
      dur:Math.round(laps.reduce((s,l)=>s+(+tag(l,'TotalTimeSeconds')||0),0))||null, cal:laps.reduce((s,l)=>s+(+tag(l,'Calories')||0),0)||null, avgHr:null, maxHr:null};
    const pts=[...a.getElementsByTagName('Trackpoint')].map(tp=>{ const hr=tp.getElementsByTagName('HeartRateBpm')[0]; return [Date.parse(tag(tp,'Time')), hr?+tag(hr,'Value'):null]; }).filter(p=>p[1]&&!isNaN(p[0]));
    return summarize(o,pts); }).filter(o=>o.start);
}
function parseFIT(buf){
  const dv=new DataView(buf); const hs=dv.getUint8(0);
  if(dv.byteLength<12 || String.fromCharCode(dv.getUint8(8),dv.getUint8(9),dv.getUint8(10),dv.getUint8(11))!=='.FIT') throw new Error('Fichier FIT illisible.');
  const end=Math.min(dv.byteLength,hs+dv.getUint32(4,true)); const EPOCH=631065600; const defs={}; let pos=hs, lastTs=0; const pts=[]; const sessions=[];
  const read=(def,cts)=>{ const v={};
    def.fields.forEach(f=>{ let x=null;
      if(f.size===1){ x=dv.getUint8(pos); if(x===0xFF) x=null; }
      else if(f.size===2){ x=dv.getUint16(pos,def.le); if(x===0xFFFF) x=null; }
      else if(f.size===4){ x=dv.getUint32(pos,def.le); if(x===0xFFFFFFFF) x=null; }
      v[f.num]=x; pos+=f.size; });
    pos+=def.devSize;
    if(v[253]!=null) lastTs=v[253]; const ts=v[253]!=null?v[253]:cts;
    if(def.gm===20 && v[3]!=null && ts!=null) pts.push([(ts+EPOCH)*1000,v[3]]);
    if(def.gm===18) sessions.push({start:v[2]!=null?(v[2]+EPOCH)*1000:null,dur:v[7]!=null?Math.round(v[7]/1000):null,cal:v[11],avgHr:v[16],maxHr:v[17],sport:v[5]});
  };
  while(pos<end){
    const h=dv.getUint8(pos++);
    if(h&0x80){ const def=defs[(h>>5)&3]; if(!def) break; const off=h&0x1f; let ts=(lastTs&~0x1f)+off; if(off<(lastTs&0x1f)) ts+=0x20; lastTs=ts; read(def,ts); continue; }
    const lt=h&0x0f;
    if(h&0x40){ const dev=!!(h&0x20); pos++; const le=dv.getUint8(pos++)===0; const gm=dv.getUint16(pos,le); pos+=2; const n=dv.getUint8(pos++); const fields=[];
      for(let i=0;i<n;i++){ fields.push({num:dv.getUint8(pos),size:dv.getUint8(pos+1)}); pos+=3; }
      let devSize=0; if(dev){ const nd=dv.getUint8(pos++); for(let i=0;i<nd;i++){ devSize+=dv.getUint8(pos+1); pos+=3; } }
      defs[lt]={gm,le,fields,devSize}; }
    else { const def=defs[lt]; if(!def) break; read(def,null); }
  }
  const SPORT={1:'Course',2:'Vélo',4:'Fitness',5:'Natation',10:'Entraînement',11:'Marche',15:'Aviron',17:'Randonnée'};
  const s=sessions[0]||{};
  const o={source:'fit',type:SPORT[s.sport]||'',title:'',start:s.start||(pts[0]&&pts[0][0]),dur:s.dur,cal:s.cal,avgHr:s.avgHr,maxHr:s.maxHr};
  if(!o.start) throw new Error('Ce fichier FIT ne contient pas d\'activité.');
  return [summarize(o,pts)];
}
async function parseWatchFile(file){
  const name=file.name.toLowerCase();
  if(name.endsWith('.csv')) return parseGarminCSV(await file.text());
  if(name.endsWith('.tcx')) return parseTCX(await file.text());
  if(name.endsWith('.fit')) return parseFIT(await file.arrayBuffer());
  if(name.endsWith('.zip')){
    if(!window.fflate) throw new Error('Lecture des .zip indisponible : décompresse le fichier et importe le .fit qu\'il contient.');
    const files=window.fflate.unzipSync(new Uint8Array(await file.arrayBuffer()));
    const out=[]; Object.entries(files).forEach(([n,data])=>{ const l=n.toLowerCase();
      if(l.endsWith('.fit')) out.push(...parseFIT(data.buffer.slice(data.byteOffset,data.byteOffset+data.byteLength)));
      else if(l.endsWith('.tcx')) out.push(...parseTCX(new TextDecoder().decode(data))); });
    if(!out.length) throw new Error('Aucun fichier .fit ou .tcx dans ce .zip.');
    return out;
  }
  throw new Error('Format non reconnu : importe un .csv, .tcx, .fit ou .zip exporté depuis Garmin Connect.');
}
function mergeWatch(list,incoming,sessionId){
  const byMin=a=>Math.round(a.start/60000);
  const out=[...list];
  incoming.forEach(a=>{ if(sessionId) a.sessionId=sessionId;
    const k=out.findIndex(x=>Math.abs(byMin(x)-byMin(a))<=1);
    if(k>=0){ const old=out[k]; out[k]={...old,...Object.fromEntries(Object.entries(a).filter(([,v])=>v!=null&&v!=='')),id:old.id,sessionId:a.sessionId||old.sessionId}; }
    else out.push(a); });
  return out.sort((a,b)=>a.start-b.start);
}
function matchWatch(history,watch){
  const map={}; const used=new Set();
  watch.forEach(a=>{ if(a.sessionId && history.some(h=>h.id===a.sessionId) && !map[a.sessionId]){ map[a.sessionId]=a; used.add(a.id); } });
  history.forEach(h=>{ if(map[h.id]) return; const hs=h.date-(h.duration||0)*1000; let best=null,bd=Infinity;
    watch.forEach(a=>{ if(used.has(a.id) || a.sessionId || dkey(a.start)!==dkey(h.date)) return; const d=Math.abs(a.start-hs); if(d<4*3600e3 && d<bd){ bd=d; best=a; } });
    if(best){ map[h.id]=best; used.add(best.id); } });
  return {map, others:watch.filter(a=>!used.has(a.id))};
}

    </section>
    ${showWatch && html`<section className="card stack">
      <div className="row between"><h3>Montre</h3>${watch.length>0 && html`<span className="pill">${watch.length} activité${watch.length>1?'s':''}</span>`}</div>
      ${watch.length===0 ? html`<p className="small muted">Importe un export Garmin Connect pour ajouter la fréquence cardiaque, les calories et la durée réelle à tes séances.</p>` : (()=>{
        const ms=history.filter(h=>wmap[h.id] && wmap[h.id].avgHr!=null).slice(-12);
        const hrData=ms.map(h=>({x:new Date(h.date).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}),y:Math.round(wmap[h.id].avgHr)}));
        const recent=watch.filter(a=>a.start>Date.now()-28*864e5);
        const kcalWeek=Math.round(recent.reduce((s,a)=>s+(a.cal||0),0)/4);
        const hrAll=recent.filter(a=>a.avgHr!=null); const hrAvg=hrAll.length?Math.round(hrAll.reduce((s,a)=>s+a.avgHr,0)/hrAll.length):null;
        return html`<div className="tiles">
            <div className="tile"><div className="v">${Object.keys(wmap).length}</div><div className="l">séances avec données montre</div></div>
            <div className="tile"><div className="v">${hrAvg!=null?hrAvg:'–'}</div><div className="l">FC moyenne (bpm), 4 sem.</div></div>
            <div className="tile"><div className="v">${kcalWeek||'–'}</div><div className="l">kcal par semaine, 4 sem.</div></div>
          </div>
          <div><div className="eyebrow">FC moyenne par séance</div><${LineChart} data=${hrData} unit="bpm"/></div>
          ${others.length>0 && html`<div className="stack" style=${{gap:'6px'}}><div className="eyebrow">Autres activités de la montre</div>
            ${others.slice(-5).reverse().map(a=>html`<div key=${a.id} className="row between small"><span><b>${a.title||a.type||'Activité'}</b> · ${fmtDate(a.start)}</span><${WatchStats} a=${a}/></div>`)}
            <p className="small muted">Ces activités comptent dans tes jours actifs.</p></div>`}`;
      })()}
      <div className="row"><${WatchPick} id="w-imp" labelText="Importer un fichier Garmin" onFiles=${f=>importFiles(f)}/><span className="small muted">.csv, .tcx, .fit ou .zip</span></div>
      ${HOWTO}
    </section>`}
    <section className="card stack">
      <div className="row between"><h3>Poids corporel</h3>${bw.length>0 && html`<span className="num" style=${{fontSize:'22px'}}>${toDisp(bw[bw.length-1].kg,u)} ${u}</span>`}</div>
      <${LineChart} data=${bwData} unit=${u}/>
      <div className="row"><input id="t-bw" className="inp grow" type="number" inputMode="decimal" step="0.1" placeholder=${'Poids du jour ('+u+')'} value=${bwIn} onChange=${e=>setBwIn(e.target.value)}/><button className="btn pri" onClick=${addBw} disabled=${!bwIn}>Ajouter</button></div>
    </section>
    <section className="card stack">
      <h3>Charges</h3>
      ${loaded.length ? html`<select id="t-ex" className="inp" value=${exId} onChange=${e=>setExSel(e.target.value)}>${loaded.map(id=>html`<option key=${id} value=${id}>${EX[id]?EX[id].n:id}</option>`)}</select>
        <${LineChart} data=${loadData} unit=${u}/><p className="small muted">Charge maximale soulevée à chaque séance.</p>`
      : html`<p className="muted small">Les courbes de charge apparaissent dès que tu enregistres des séries avec une charge.</p>`}
    </section>
    <section className="card stack">
      <h3>Volume par séance</h3>
      <${BarChart} data=${volData} unit=${u}/>
      <p className="small muted">Volume = charge × répétitions, additionné sur toutes les séries (${u}).</p>
    </section>
    <section className="stack">
      <h2>Historique</h2>
      ${history.length===0 && html`<p className="muted">Aucune séance enregistrée pour l'instant. Lance ta première séance depuis l'onglet Séance.</p>`}
      ${[...history].reverse().map(h=>html`<details className="card hist" key=${h.id}>
        <summary><div><b>${h.title}</b><p className="small muted">${fmtDate(h.date)} · semaine ${h.week} · ${fmtClock(h.duration)}${wmap[h.id]&&wmap[h.id].avgHr!=null?' · ♥ '+Math.round(wmap[h.id].avgHr)+' bpm':''}</p></div><span className="num" style=${{fontSize:'18px'}}>${toDisp(h.volume,u)} ${u}</span></summary>
        <div className="stack" style=${{marginTop:'12px'}}>
          ${wmap[h.id] && html`<div className="stack" style=${{gap:'8px'}}><${WatchStats} a=${wmap[h.id]}/><${HrCurve} a=${wmap[h.id]}/></div>`}
          ${h.exercises.map((e,i)=>html`<div key=${i} className="small"><b>${e.name}</b><div className="muted">${e.sets.map(s=>s.t!=null?s.t+' s':(s.w?toDisp(s.w,u)+' '+u+' × ':'')+s.r).join(' · ')||'non fait'}</div></div>`)}
          ${del===h.id ? html`<div className="row"><span className="small">Supprimer cette séance ?</span><button className="btn sm danger" onClick=${()=>{setHistory(history.filter(x=>x.id!==h.id));setDel(null);}}>Supprimer</button><button className="btn sm" onClick=${()=>setDel(null)}>Annuler</button></div>`
            : html`<div className="row">${settings.watch && html`<${WatchPick} small id=${'w-'+h.id} labelText=${wmap[h.id]?'Remplacer les données montre':'Lier un fichier de la montre'} onFiles=${f=>importFiles(f,h.id)}/>`}<button className="btn sm ghost" onClick=${()=>setDel(h.id)}>Supprimer</button></div>`}
        </div>
      </details>`)}
    </section>
  </div>`;
}

/* ---------- Profil ---------- */
function ProfileView({profile,settings,setSettings,onEdit,onRegenerate,onReset,onDemo,watch,setWatch}){
  const [confirm,setConfirm]=useState(null);
  const u=settings.unit;
  const rows=[
    ['Profil',[profile.age+' ans',label([['homme','Homme'],['femme','Femme'],['autre','Autre']],profile.sexe),profile.taille+' cm',toDisp(profile.poids,u)+' '+u,label(LEVELS,profile.niveau)].join(' · ')],
    ['Objectifs',label(GOALS,profile.objectif)+(profile.objectif2?' + '+label(GOALS,profile.objectif2):'')+(profile.sport?' ('+profile.sport+')':'')],
    ['Zones à ménager',profile.blessures.length?profile.blessures.map(z=>label(ZONES,z)).join(', '):'Aucune'],
    ['Lieu et matériel',label(PLACES,profile.lieu)+' · '+profile.materiel.map(m=>label(EQUIP,m)).join(', ')],
    ['Planning',profile.seances+' séances ('+[...profile.jours].sort().map(d=>DAYS3[d]).join(', ')+') · '+profile.duree+' min · '+profile.semaines+' semaines'],
    ['Style',label(STYLES,profile.style)+' · '+label(SPLITS,profile.split)+' · intensité '+label(INTENS,profile.intensite).toLowerCase()+' · repos '+label(RESTS,profile.repos).toLowerCase()],
    ['Options',(profile.echauffement?'Échauffement':'Sans échauffement')+' · '+(profile.retour?'retour au calme':'sans retour au calme')],
    ['Muscles prioritaires',profile.prioritaires.length?profile.prioritaires.join(', '):'Aucun'],
    ['Favoris / exclus',profile.favoris.length+' favori'+(profile.favoris.length>1?'s':'')+' · '+profile.exclus.length+' exclu'+(profile.exclus.length>1?'s':'')],
  ];
  return html`<div className="stack lg">
    <h1>Profil</h1>
    <section className="card stack">
      ${rows.map(([k,v])=>html`<div key=${k}><div className="eyebrow">${k}</div><div>${v}</div></div>`)}
      <div className="row"><button className="btn pri" onClick=${onEdit}>Modifier mon profil</button>
        ${confirm==='regen' ? html`<span className="row"><span className="small">Tes remplacements seront perdus.</span><button className="btn sm" onClick=${()=>{onRegenerate();setConfirm(null);}}>Confirmer</button><button className="btn sm ghost" onClick=${()=>setConfirm(null)}>Annuler</button></span>`
          : html`<button className="btn" onClick=${()=>setConfirm('regen')}>Générer une autre version</button>`}</div>
    </section>
    <section className="card stack">
      <h3>Apparence</h3>
      <div className="stack"><span className="eyebrow">Thème</span><${Seg} id="p-theme" value=${settings.theme} options=${[['auto','Auto'],['light','Clair'],['dark','Sombre']]} onChange=${v=>setSettings(s=>({...s,theme:v}))}/></div>
      <div className="stack"><span className="eyebrow">Couleur d'accent</span>
        <div className="swatches">${ACCENTS.map(([k,n,l,d])=>html`<button key=${k} className="swatch" title=${n} aria-label=${n} aria-pressed=${settings.accent===k} style=${{background:`linear-gradient(135deg, ${l} 50%, ${d} 50%)`}} onClick=${()=>setSettings(s=>({...s,accent:k}))}></button>`)}</div></div>
      <div className="stack"><span className="eyebrow">Unités</span><${Seg} id="p-unit" value=${settings.unit} options=${[['kg','Kilogrammes (kg)'],['lb','Livres (lb)']]} onChange=${v=>setSettings(s=>({...s,unit:v}))}/></div>
    </section>
    <section className="card stack">
      <div className="toggle" style=${{borderBottom:0,paddingBlock:0}}><div><h3>Montre Garmin</h3><p className="small muted">Facultatif. Active-le si tu as une montre : tu pourras importer tes activités dans Suivi. Sans montre, rien ne change.</p></div><${Switch} id="p-watch" checked=${!!settings.watch} onChange=${v=>setSettings(s=>({...s,watch:v}))}/></div>
      ${watch.length>0 && html`<div className="row"><span className="small muted">${watch.length} activité${watch.length>1?'s':''} importée${watch.length>1?'s':''}</span>
        ${confirm==='watch' ? html`<button className="btn sm danger" onClick=${()=>{setWatch([]);setConfirm(null);}}>Oui, supprimer</button><button className="btn sm ghost" onClick=${()=>setConfirm(null)}>Annuler</button>`
          : html`<button className="btn sm danger" onClick=${()=>setConfirm('watch')}>Supprimer les données montre</button>`}</div>`}
    </section>
    <section className="card stack">
      <h3>Données</h3>
      <p className="small muted">Tout est enregistré dans ce navigateur, sur cet appareil. Rien n'est envoyé ailleurs. Si tu effaces les données du site ou changes d'appareil, l'historique ne suit pas.</p>
      <div className="row">
        <button className="btn" onClick=${onDemo}>Ajouter 3 séances d'exemple</button>
        ${confirm==='reset' ? html`<button className="btn danger" onClick=${onReset}>Oui, tout effacer</button><button className="btn ghost" onClick=${()=>setConfirm(null)}>Annuler</button>`
          : html`<button className="btn danger" onClick=${()=>setConfirm('reset')}>Tout effacer</button>`}
      </div>
    </section>
    <p className="small muted" style=${{textAlign:'center'}}>FazFit · les conseils de l'appli ne remplacent pas l'avis d'un médecin ou d'un kiné en cas de blessure.</p>
  </div>`;
}

/* ---------- Application ---------- */
const ORIG_THEME = document.documentElement.getAttribute('data-theme');
function App(){
  const [settings,setSettings]=useState(()=>LS.get('settings',{theme:'auto',accent:'piste',unit:'kg'}));
  const [profile,setProfile]=useState(()=>LS.get('profile',null));
  const [program,setProgram]=useState(()=>LS.get('program',null));
  const [history,setHistory]=useState(()=>LS.get('history',[]));
  const [bw,setBw]=useState(()=>LS.get('bw',[]));
  const [watch,setWatch]=useState(()=>LS.get('watch',[]));
  const [session,setSession]=useState(()=>LS.get('session',null));
  const [tab,setTab]=useState(()=>LS.get('session',null)?'go':'prog');
  const [editing,setEditing]=useState(false);
  const [toastMsg,setToast]=useState('');
  useEffect(()=>{ if(program && profile && program.v!==PROGRAM_V){ const np=generate(profile); np.createdAt=program.createdAt; setProgram(np); setToast('Programme réorganisé avec la nouvelle banque d\'exercices'); } },[]);
  useEffect(()=>LS.set('settings',settings),[settings]);
  useEffect(()=>LS.set('profile',profile),[profile]);
  useEffect(()=>LS.set('program',program),[program]);
  useEffect(()=>LS.set('history',history),[history]);
  useEffect(()=>LS.set('bw',bw),[bw]);
  useEffect(()=>LS.set('watch',watch),[watch]);
  useEffect(()=>LS.set('session',session),[session]);
  useEffect(()=>{ if(!toastMsg) return; const t=setTimeout(()=>setToast(''),2600); return ()=>clearTimeout(t); },[toastMsg]);
  useEffect(()=>{
    const r=document.documentElement;
    if(settings.theme==='auto'){ if(ORIG_THEME) r.setAttribute('data-theme',ORIG_THEME); else r.removeAttribute('data-theme'); }
    else r.setAttribute('data-theme',settings.theme);
    const a=ACCENTS.find(x=>x[0]===settings.accent)||ACCENTS[0];
    r.style.setProperty('--acc-l',a[2]); r.style.setProperty('--acc-d',a[3]);
  },[settings.theme,settings.accent]);

  const progWeek = useMemo(()=>{
    if(!program) return 1;
    const n=history.filter(h=>h.programAt===program.createdAt).length;
    return Math.min(program.weeks,Math.floor(n/Math.max(1,program.days.length))+1);
  },[program,history]);
  const [week,setWeek]=useState(progWeek);
  useEffect(()=>setWeek(progWeek),[progWeek]);

  const finishQuestionnaire=p=>{
    const first=!profile;
    setProfile(p); setProgram(generate(p)); setEditing(false); setTab('prog');
    if(first && p.poids) setBw(b=>b.length?b:[{date:Date.now(),kg:p.poids}]);
    setToast(first?'Programme généré':'Programme mis à jour');
    window.scrollTo(0,0);
  };
  const start=di=>{
    const day=JSON.parse(JSON.stringify(program.days[di]));
    const P=day.items.map(it=>presc(it,week,program.weeks,profile.niveau));
    setSession({dayIdx:di,week,day,P,steps:buildSteps(day,P),step:0,logs:{},start:Date.now(),restEnd:null,workEnd:null});
    setTab('go'); window.scrollTo(0,0);
  };
  const finish=()=>{
    const s=session;
    const exercises=s.day.items.map((it,i)=>({exId:it.exId,name:EX[it.exId].n,sets:(s.logs[i]||[]).filter(l=>l&&l.d).map(l=>({w:l.w||0,r:l.r||0,t:l.t!=null?l.t:undefined}))}));
    const volume=Math.round(exercises.reduce((v,e)=>v+e.sets.reduce((a,x)=>a+(x.w||0)*(x.r||0),0),0));
    setHistory(h=>[...h,{id:Date.now(),date:Date.now(),programAt:program.createdAt,dayIdx:s.dayIdx,week:s.week,title:s.day.title,duration:Math.round((Date.now()-s.start)/1000),exercises,volume}]);
    setSession(null); setTab('track'); setToast('Séance enregistrée'); window.scrollTo(0,0);
  };
  const demo=()=>{
    const now=Date.now(); const out=[];
    [6,4,2].forEach((ago,k)=>{
      const d=program.days[k%program.days.length];
      const exercises=d.items.map(it=>{ const ex=EX[it.exId]; const pr=presc(it,1,program.weeks,profile.niveau);
        const base= ex.k==='r' ? ( /barre/.test(ex.eq)?40:/machines/.test(ex.eq)?35:12 ) + k*2.5 : 0;
        return {exId:it.exId,name:ex.n+' (exemple)',sets:Array.from({length:pr.sets},()=>pr.type==='time'?{w:0,r:0,t:pr.dur}:{w:base,r:pr.reps})}; });
      const volume=Math.round(exercises.reduce((v,e)=>v+e.sets.reduce((a,x)=>a+(x.w||0)*(x.r||0),0),0));
      out.push({id:now-ago*864e5,date:now-ago*864e5,programAt:'exemple',dayIdx:k,week:1,title:d.title+' (exemple)',duration:(dayEst(d)-3)*60,exercises,volume});
    });
    setHistory(h=>[...h,...out].sort((a,b)=>a.date-b.date)); setTab('track'); setToast('3 séances d\'exemple ajoutées');
  };
  const reset=()=>{ LS.clear(); setProfile(null); setProgram(null); setHistory([]); setBw([]); setWatch([]); setSession(null); setSettings({theme:'auto',accent:'piste',unit:'kg'}); setTab('prog'); };

  const needsQ = !profile || !program || editing;
  return html`<${React.Fragment}>
    <header className="top"><div className="wrap">
      <div className="brand">Faz<b>Fit</b></div>
      ${session && tab!=='go' && html`<button className="btn sm pri" onClick=${()=>setTab('go')}>Séance en cours</button>`}
      ${!session && profile && program && !editing && html`<span className="small muted">Semaine ${week} / ${program.weeks}</span>`}
    </div></header>
    <main className="wrap">
      ${needsQ ? html`<${Questionnaire} key=${editing?'edit':'new'} initial=${profile||DEFAULT_PROFILE} settings=${settings} setSettings=${setSettings} onDone=${finishQuestionnaire} onCancel=${editing?()=>setEditing(false):null}/>`
      : tab==='prog' ? html`<${ProgramView} profile=${profile} program=${program} setProgram=${setProgram} week=${week} setWeek=${setWeek} onStart=${start} history=${history} toast=${setToast}/>`
      : tab==='go' ? (session ? html`<${SessionView} session=${session} setSession=${setSession} program=${program} profile=${profile} settings=${settings} history=${history} onFinish=${finish} onAbort=${()=>{setSession(null);setTab('prog');}}/>`
                              : html`<${SessionPicker} program=${program} profile=${profile} week=${week} history=${history} onStart=${start}/>`)
      : tab==='track' ? html`<${TrackView} history=${history} setHistory=${setHistory} bw=${bw} setBw=${setBw} settings=${settings} profile=${profile} setProfile=${setProfile} watch=${watch} setWatch=${setWatch} toast=${setToast}/>`
      : html`<${ProfileView} profile=${profile} settings=${settings} setSettings=${setSettings} onEdit=${()=>{setEditing(true);window.scrollTo(0,0);}} onRegenerate=${()=>{setProgram(generate(profile));setTab('prog');setToast('Nouvelle version générée');}} onReset=${reset} onDemo=${demo} watch=${watch} setWatch=${setWatch}/>`}
    </main>
    ${!needsQ && html`<nav className="tabs" aria-label="Navigation"><div className="wrap">
      ${[['prog','Programme',I.prog],['go','Séance',I.go],['track','Suivi',I.chart],['me','Profil',I.user]].map(([k,l,ic])=>html`<button key=${k} aria-current=${tab===k?'page':undefined} onClick=${()=>{setTab(k);window.scrollTo(0,0);}}>${ic}<span>${l}</span></button>`)}
    </div></nav>`}
    ${toastMsg && html`<div className="toast" role="status">${toastMsg}</div>`}
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>
</body>
</html>
